server:
  port: 8081

spring:
  application:
    name: dom-v-poryadke-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dom_v_poryadke}
    username: ${SPRING_DATASOURCE_USERNAME:dom_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
    validate-on-migrate: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

app:
  max:
    api-url: ${MAX_API_URL:https://platform-api2.max.ru}
    bot-token: ${MAX_BOT_TOKEN:}
  nats:
    url: ${NATS_URL:nats://nats:4222}
  security:
    test-tokens:
      resident: ${TEST_RESIDENT_TOKEN:test_resident_token}
      dispatcher: ${TEST_DISPATCHER_TOKEN:test_dispatcher_token}
      master: ${TEST_MASTER_TOKEN:test_master_token}

logging:
  level:
    root: INFO
    ru.domvporyadke: DEBUG